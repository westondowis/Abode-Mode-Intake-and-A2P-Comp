<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS Opt-In Disclosure Evidence | Abode Mode</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #00171c; padding: 40px 20px; }
    .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 1.5rem; color: #00171c; border-bottom: 2px solid #004250; padding-bottom: 8px; }
    .form-box { margin-top: 24px; border: 1px solid #e2e8f0; padding: 20px; border-radius: 6px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="tel"], input[type="email"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    .checkbox-row { display: flex; align-items: flex-start; gap: 12px; margin-top: 20px; }
    .checkbox-row input { margin-top: 4px; width: 18px; height: 18px; }
    .disclosure { font-size: 0.875rem; color: #334155; line-height: 1.5; }
    .disclosure a { color: #004250; font-weight: 600; }
    .btn { background: #004250; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-weight: 600; margin-top: 20px; width: 100%; cursor: not-allowed; opacity: 0.8; }
    .notice { background: #f0fdf4; border-left: 4px solid #16a34a; padding: 12px; margin-bottom: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Abode Mode — SMS Opt-In Evidence</h1>
    <div class="notice">
      <strong>For Compliance Reviewers:</strong> This page serves as static visual evidence of the SMS consent workflow presented to end-users on the final step of our property intake application.
    </div>
    
    <div class="form-box">
      <div class="field">
        <label>Property Address / Parcel</label>
        <input type="text" placeholder="123 Rural Route, County, State" disabled>
      </div>
      <div class="field">
        <label>Full Name *</label>
        <input type="text" placeholder="John Doe" disabled>
      </div>
      <div class="field">
        <label>Phone Number *</label>
        <input type="tel" placeholder="(555) 000-0000" disabled>
      </div>
      <div class="field">
        <label>Email Address *</label>
        <input type="email" placeholder="john@example.com" disabled>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="sms" disabled>
        <label for="sms" class="disclosure">
          By checking this box, I agree that Abode Mode may send me text messages about my property inquiry, property options, appointments, and next steps. Message frequency varies. Message and data rates may apply. Reply STOP to cancel or HELP for help. Consent is not a condition of service. View our <a href="https://abodebuys.com/privacy.html">Privacy Policy</a> and <a href="https://abodebuys.com/terms.html">SMS Terms</a>.
        </label>
      </div>

      <button class="btn" disabled>Submit Property Inquiry</button>
    </div>
  </div>
</body>
</html>
